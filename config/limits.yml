config_version: "1.0.0"

# Maximum initial budgets per run (SPEC_V1 section 3).
run_budgets:
  max_raw_candidates: 1000
  max_light_analysis: 200
  max_relationship_seeds: 20
  max_deep_analysis: 25

github:
  api_base_url: "https://api.github.com"
  api_version: "2022-11-28"
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  max_retries: 3
  backoff_base_seconds: 2
  backoff_max_seconds: 30
  rate_limit_yellow_floor: 200
  rate_limit_red_floor: 50
  search_rate_limit_yellow_floor: 10
  search_rate_limit_red_floor: 5
  per_page: 50

light_analysis:
  max_tree_items: 400
  max_readme_bytes: 200000
  max_manifest_bytes: 200000
  max_readme_chars_for_hash: 60000

deep_analysis:
  max_files: 12
  max_file_bytes: 120000
  max_total_bytes: 400000
  max_docs_files: 4
  max_test_files: 3
  max_source_files: 4
  max_manifest_files: 2

llm:
  enabled_default: false
  provider: deepseek
  model: deepseek-chat
  api_base_url: "https://api.deepseek.com"
  api_key_env_var: DEEPSEEK_API_KEY
  timeout_seconds: 60
  max_llm_candidates_per_run: 25
  max_llm_calls_per_run: 30
  max_input_tokens_per_repo: 12000
  max_output_tokens_per_repo: 1500
  max_llm_budget_per_run: 0.5
  max_retries_per_candidate: 1
  cost_per_1k_input_tokens: 0.0
  cost_per_1k_output_tokens: 0.0

reporting:
  normal_max: 5
  absolute_max: 10
  extra_positions_min_score: 85
  labels:
    - discovery-report
  exceptional_label: exceptional-findings
  update_label: has-updates
  max_description_chars: 600

state:
  state_branch: state
  database_filename: history.sqlite3
  manifest_filename: state_manifest.json
  max_backups: 3
