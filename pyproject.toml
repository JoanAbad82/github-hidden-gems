[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-gems"
version = "0.1.0"
description = "GitHub Hidden Gems V1 - low-noise discovery of valuable low-visibility repositories"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hidden-gems = "hidden_gems.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: requires network access and opt-in RUN_LIVE_TESTS=1 (read-only unless explicitly enabled)",
]
