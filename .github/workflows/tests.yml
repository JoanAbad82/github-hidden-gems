name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hidden-gems-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suite:
    name: offline test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate configuration
        run: hidden-gems validate-config --root .

      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          for path in sorted(Path("schemas").glob("*.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              jsonschema.Draft202012Validator.check_schema(schema)
              print(f"schema ok: {path}")
          PY

      - name: Unit tests
        run: python -m pytest tests/unit -m "not live" -q

      - name: Integration tests
        run: python -m pytest tests/integration -m "not live" -q
